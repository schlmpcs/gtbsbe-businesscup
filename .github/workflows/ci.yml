name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A throwaway Postgres for the store's integration tests (TEST_STORE_URL below). Same major
    # version as deploy/compose.yaml. The password only exists inside this job.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lifeguessr
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: lifeguessr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lifeguessr -d lifeguessr_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from "packageManager" in package.json (pnpm@10.34.9).
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # With TEST_STORE_URL set, the Postgres tests of apps/web/src/server/store and server/pro run
      # instead of skipping (each in its own schema).
      - run: pnpm test
        env:
          TEST_STORE_URL: postgres://lifeguessr:ci-only-not-a-secret@localhost:5432/lifeguessr_test
      # Data pipeline (Python standard library, no network): parsers + out/areas.json is up to date.
      - run: pnpm --filter @lifeguessr/data test:py
      # Built as production builds it (deploy/Dockerfile defaults): the duel at /play against the
      # server routes, and the slider game (the rollback) against them too.
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_GAME_MODE: duel
          NEXT_PUBLIC_GAME_SOURCE: api
          NEXT_PUBLIC_DUEL_SOURCE: api
      # No game answers in the browser chunks of that build: no catalog card, no fixture game or
      # duel client, no duel sample card (scripts/check-client-bundle.mjs), and the HTTP
      # duel client present, which proves the chunks scanned are the game's. It reads the same flags
      # (and with the duel mode set the slider game has no chunk at all, so it does not look for it).
      - run: pnpm check:bundle
        env:
          NEXT_PUBLIC_GAME_MODE: duel
          NEXT_PUBLIC_DUEL_SOURCE: api

  # The Playwright specs in apps/web/e2e (phone + desktop), on the FIXTURE build: no game flag, so the
  # duel is computed in the browser (the build `pnpm e2e` makes for anyone without a store; this job
  # also gives it one for the server sessions and funnel events: NEXT_PUBLIC_SESSION_SOURCE=api,
  # NEXT_PUBLIC_EVENTS_SOURCE=api). `pnpm e2e` builds and starts the app itself, on a GitHub-hosted
  # runner in parallel with `check`. The production build is `e2e-production` below.
  e2e:
    name: e2e on the fixture build (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lifeguessr
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: lifeguessr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lifeguessr -d lifeguessr"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Both projects (Pixel 7, Desktop Chrome) run on Chromium.
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          NEXT_TELEMETRY_DISABLED: 1
          AVATARS_ENABLED: 'true'
          NEXT_PUBLIC_AVATARS_ENABLED: 'true'
          NEXT_PUBLIC_SESSION_SOURCE: api
          NEXT_PUBLIC_EVENTS_SOURCE: api
          STORE_URL: postgres://lifeguessr:ci-only-not-a-secret@localhost:5432/lifeguessr
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  # The production build: the flags deploy/Dockerfile defaults to (the duel at /play, both games
  # against the server routes) plus server sessions and funnel events, on a real Postgres store. It
  # runs the demo path (first visit, Play, five duels with a hint, the day result, "Price my own
  # month", the ladder, the forecast, Loan Lab, with every funnel step stored), the duel against the
  # server (duel-api.spec.ts: hint, picks scored once, resume after a reload, Today counting the
  # server's rounds, no streamer link) and every screen route (smoke.spec.ts). The other specs do
  # not depend on the game flags and run on the fixture build in `e2e`. Then the same build's
  # browser chunks are checked: no catalog card, no fixture game or duel client, no duel sample
  # card, and the HTTP duel client present.
  e2e-production:
    name: e2e on the production build (Playwright) + bundle check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lifeguessr
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: lifeguessr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lifeguessr -d lifeguessr"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_GAME_MODE: duel
      NEXT_PUBLIC_GAME_SOURCE: api
      NEXT_PUBLIC_DUEL_SOURCE: api
      NEXT_PUBLIC_SESSION_SOURCE: api
      NEXT_PUBLIC_EVENTS_SOURCE: api
      STORE_URL: postgres://lifeguessr:ci-only-not-a-secret@localhost:5432/lifeguessr
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium
      # `pnpm e2e` builds the app with the env above and starts it.
      - run: pnpm e2e demo-path.spec.ts duel-api.spec.ts smoke.spec.ts
      - run: pnpm check:bundle
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-production
          path: apps/web/playwright-report
          retention-days: 7

  # The rollback build: NEXT_PUBLIC_GAME_MODE=slider (the one-line change deploy/README.md gives for
  # going back), so /play is the slider game again, against the server routes, with S4 streamer mode
  # linked. Only the specs that depend on that mode run: the slider game and its streamer mode
  # (play.spec.ts: they are skipped in every other build), every screen route with S4 in the list
  # (smoke.spec.ts) and the streamer notice that links back to /play?stream=1 (overpaying.spec.ts).
  # Then the bundle check, for this build's flags.
  e2e-rollback:
    name: e2e on the rollback build, GAME_MODE=slider (Playwright) + bundle check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lifeguessr
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: lifeguessr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lifeguessr -d lifeguessr"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_GAME_MODE: slider
      NEXT_PUBLIC_GAME_SOURCE: api
      NEXT_PUBLIC_DUEL_SOURCE: api
      NEXT_PUBLIC_SESSION_SOURCE: api
      NEXT_PUBLIC_EVENTS_SOURCE: api
      STORE_URL: postgres://lifeguessr:ci-only-not-a-secret@localhost:5432/lifeguessr
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm e2e play.spec.ts smoke.spec.ts overpaying.spec.ts
      - run: pnpm check:bundle
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-rollback
          path: apps/web/playwright-report
          retention-days: 7

  # deploy/deploy.sh run for real on this runner (DEPLOY_HOST=local), as the server's runner runs
  # it: the image build (with no game flag in the .env, so the Dockerfile's production defaults
  # must make /api/health report duel / api / api), the app + postgres compose stack, the store
  # backup, the health and store checks, the duel played on the real image (five duels, a hint, a
  # pick, its share card), a redeploy that must keep the database and the pick, a rollback, and a
  # database outage. Nothing leaves the runner; see .github/scripts/deploy-smoke.sh.
  deploy-smoke:
    name: deploy dry run (compose stack)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: .github/scripts/deploy-smoke.sh
