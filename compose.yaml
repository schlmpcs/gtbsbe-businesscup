services:
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, api]
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      STORE_MODE: postgres
      PUBLIC_ORIGIN: https://${DOMAIN:?Set DOMAIN in .env}
      TRUST_PROXY: "true"
volumes:
  caddy_data:
  caddy_config:
